apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bonsai-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bharatdwaj3/Bonsai
    targetRevision: main
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: bonsai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true