apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bonsai-dev-route
  namespace: bonsai-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`REPLACE_WITH_YOUR_SUBDOMAIN.duckdns.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: frontend
          port: 5114
    - match: Host(`REPLACE_WITH_YOUR_SUBDOMAIN.duckdns.org`) && PathPrefix(`/api/grove`)
      kind: Rule
      services:
        - name: grove
          port: 4001
  tls:
    certResolver: default
