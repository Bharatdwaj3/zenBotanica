apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: {{ .Release.Namespace }}
  name: gardeners-route
  labels:
  {{- include "bonsai-exposure.labels" . | nindent 4 }}
spec:
  hostnames:
  - bonsai.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bonsai-gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: gardeners
      port: 4003
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /api/v1/auth
    - path:
        type: PathPrefix
        value: /api/v1/faculty
    - path:
        type: PathPrefix
        value: /api/v1/student
