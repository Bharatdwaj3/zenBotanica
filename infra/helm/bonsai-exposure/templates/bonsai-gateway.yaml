apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: {{ .Release.Namespace }}
  name: bonsai-gateway
  labels:
  {{- include "bonsai-exposure.labels" . | nindent 4 }}
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: bonsai-gateway-proxy-config
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: bonsai.local
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: bonsai.local
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: frontend-tls
      mode: Terminate
