apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: tending-db
  labels:
    app-name: tending-db
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  type: {{ .Values.tendingDb.type }}
  selector:
    app-name: tending-db
  ports:
  {{- .Values.tendingDb.ports | toYaml | nindent 2 }}
