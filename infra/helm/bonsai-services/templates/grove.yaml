apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: grove
  labels:
    bonsai-service: grove
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grove.type }}
  selector:
    bonsai-service: grove
    {{- include "bonsai-services.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.grove.ports | toYaml | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  namespace: {{ .Release.Namespace }}
  name: grove
  labels:
    bonsai-service: grove
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 120
  replicas: 3
  selector:
    matchLabels:
      bonsai-service: grove
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 30s
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  template:
    metadata:
      labels:
        bonsai-service: grove
    spec:
      containers:
      - args:
        - sh
        - -c
        - npx prisma generate && npx prisma migrate deploy && npm start
        envFrom:
        - secretRef:
            name: grove-secrets
        image: {{ .Values.grove.image.repository }}:{{ .Values.grove.image.tag | default .Chart.AppVersion }}
        name: grove-ctr
        ports:
        - containerPort: 4001
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 4001
        resources: {{- toYaml .Values.grove.resources | nindent 10 }}
      imagePullSecrets:
      - name: ghcr-secret
      restartPolicy: Always
status: {}
