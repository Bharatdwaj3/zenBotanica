apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: gardeners-db-headless
  labels:
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gardenersDbHeadless.type }}
  selector:
    app: gardeners-db
  ports:
  {{- .Values.gardenersDbHeadless.ports | toYaml | nindent 2 }}
