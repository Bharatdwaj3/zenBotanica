apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: grafana
  labels:
    io.kompose.service: grafana
  {{- include "bonsai-observability.labels" . | nindent 4 }}
  annotations:
    kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
    kompose.version: 1.31.2 (a92241f79)
spec:
  type: {{ .Values.grafana.type }}
  selector:
    io.kompose.service: grafana
    {{- include "bonsai-observability.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.grafana.ports | toYaml | nindent 2 }}
