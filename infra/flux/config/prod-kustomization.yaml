apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bonsai-prod
  namespace: flux-system
spec:
  interval: 5m0s
  dependsOn:
    - name: argo-rollouts
  sourceRef:
    kind: GitRepository
    name: zenbotanica
  path: ./k8s/overlays/prod
  prune: true
  wait: false
  timeout: 5m0s
  targetNamespace: bonsai-prod
  serviceAccountName: bonsai-prod-reconciler
  decryption:
    provider: sops
    secretRef:
      name: sops-age
