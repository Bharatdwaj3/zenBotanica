apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-backend
  namespace: bonsai-prod
spec:
  provider:
    kubernetes:
      remoteNamespace: bonsai-prod
      server:
        url: "https://kubernetes.default.svc"
      auth:
        serviceAccount:
          name: external-secrets
          namespace: bonsai-prod
