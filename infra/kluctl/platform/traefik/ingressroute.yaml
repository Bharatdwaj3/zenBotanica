apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rudrashayan-route
  namespace: jam-bonsai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rudrashayan.duckdns.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: frontend
          namespace: kam-bomsai
          port: 5114
  tls:
    certResolver: default
