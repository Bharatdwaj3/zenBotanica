apiVersion: gitops.kluctl.io/v1beta1
kind: KluctlDeployment
metadata:
  name: zenbotanica-prod
  namespace: bonsai-prod
spec:
  interval: 5m
  source:
    git:
      url: https://github.com/Bharatdwaj3/zenBotanica.git
      path: "infra/kluctl"
  timeout: 2m
  target: prod
  prune: false
  delete: false
