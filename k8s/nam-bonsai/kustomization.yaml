namespace: nam-bonsai
resources:
  - namespace.yaml
  - workloads
  - databases
  - services
  - gateway
  - secrets
  - argo
patches:
  - target:
      kind: Rollout
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
