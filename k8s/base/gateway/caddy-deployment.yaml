apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: bonsai-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: caddy
        image: caddy:2-alpine
        ports:
        - containerPort: 443
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: tls-certs
          mountPath: /etc/caddy/certs
          readOnly: true
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config
      - name: tls-certs
        secret:
          secretName: dev-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: bonsai-dev
spec:
  type: NodePort
  selector:
    app: caddy
  ports:
    - protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
