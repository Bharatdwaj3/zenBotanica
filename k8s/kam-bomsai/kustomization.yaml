apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kam-bomsai

resources:
  - ../base
  - ingress.yaml
  - ingress-frontend-api.yaml
  - ingress-frontend-alias.yaml
  - ingress-tools.yaml
  - observability

patches:
  - target:
      kind: CronJob
      name: tending-care-reminder
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
  - target:
      kind: Rollout
    path: scale-rollouts.yaml
  - target:
      kind: StatefulSet
    path: scale-statefulsets.yaml
  - target:
      kind: Rollout
      name: firebase
    path: firebase-cache.yaml
  - target:
      kind: Rollout
      name: visitor-services
    path: visitor-db-host.yaml
  - target:
      kind: Rollout
      name: ^(grove|gardeners|marketplace|tending|visitor-services)$
    path: dev-command.yaml
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /spec/tls
        value:
          - secretName: kam-tls
            hosts:
              - gardeners.127.0.0.1.sslip.io
              - grove.127.0.0.1.sslip.io
              - marketplace.127.0.0.1.sslip.io
              - tending.127.0.0.1.sslip.io
              - visitor-services.127.0.0.1.sslip.io
              - frontend.127.0.0.1.sslip.io
              - mailhog.127.0.0.1.sslip.io
  - target:
      kind: Ingress
      name: ^kam-bomsai-dev-tools$
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
  - target:
      kind: Ingress
      name: ^(kam-bomsai-alias-masters|kam-bomsai-alias-masters-profile|kam-bomsai-alias-tending|kam-bomsai-dev-frontend-api|kam-bomsai-dev-ingress)$
    patch: |-
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
