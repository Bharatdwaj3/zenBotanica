apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kam-bomsai

resources:
  - ../base
  - ingress.yaml

patches:
  - target:
      kind: CronJob
      name: tending-care-reminder
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
  - target:
      kind: Rollout
    path: scale-rollouts.yaml
  - target:
      kind: StatefulSet
    path: scale-statefulsets.yaml
  - target:
      kind: Rollout
      name: firebase
    path: firebase-cache.yaml
