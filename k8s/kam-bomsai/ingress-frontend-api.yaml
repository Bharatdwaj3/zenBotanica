apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kam-bomsai-dev-frontend-api
  namespace: kam-bomsai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "300m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: frontend.127.0.0.1.sslip.io
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: gardeners
                port:
                  number: 4003
          - path: /api/v1/botanist
            pathType: Prefix
            backend:
              service:
                name: gardeners
                port:
                  number: 4003
          - path: /api/v1/apprentice
            pathType: Prefix
            backend:
              service:
                name: gardeners
                port:
                  number: 4003
          - path: /api/v1/caretaker
            pathType: Prefix
            backend:
              service:
                name: gardeners
                port:
                  number: 4003
          - path: /api/v1/specimen
            pathType: Prefix
            backend:
              service:
                name: grove
                port:
                  number: 4001
          - path: /api/v1/storage
            pathType: Prefix
            backend:
              service:
                name: grove
                port:
                  number: 4001
          - path: /api/v1/cart
            pathType: Prefix
            backend:
              service:
                name: grove
                port:
                  number: 4001
          - path: /api/v1/wishlist
            pathType: Prefix
            backend:
              service:
                name: grove
                port:
                  number: 4001
          - path: /api/v1/session
            pathType: Prefix
            backend:
              service:
                name: tending
                port:
                  number: 4002
          - path: /api/v1/penalty
            pathType: Prefix
            backend:
              service:
                name: tending
                port:
                  number: 4002
          - path: /api/v1/care
            pathType: Prefix
            backend:
              service:
                name: tending
                port:
                  number: 4002
          - path: /api/v1/product
            pathType: Prefix
            backend:
              service:
                name: marketplace
                port:
                  number: 4005
          - path: /api/v1/listing
            pathType: Prefix
            backend:
              service:
                name: marketplace
                port:
                  number: 4005
          - path: /api/v1/ticket
            pathType: Prefix
            backend:
              service:
                name: visitor-services
                port:
                  number: 4004
          - path: /api/v1/violation
            pathType: Prefix
            backend:
              service:
                name: visitor-services
                port:
                  number: 4004
          - path: /api/v1/help-request
            pathType: Prefix
            backend:
              service:
                name: visitor-services
                port:
                  number: 4004
