apiVersion: apps/v1
kind: Deployment
metadata:
  name: tending-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app-name: tending-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app-name: tending-db
    spec:
      containers:
        - env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_User
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_Password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_Database
          image: postgres:15-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tending_user
                - -d
                - tending_db
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: tending-db-ctr
          ports:
            - containerPort: 5432
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: tending-data
      restartPolicy: Always
      volumes:
        - name: tending-data
          persistentVolumeClaim:
            claimName: tending-data
status: {}
