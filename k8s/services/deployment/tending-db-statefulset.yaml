apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tending-db
spec:
  serviceName: tending-db-headless
  replicas: 1
  selector:
    matchLabels:
      app-name: tending-db
  template:
    metadata:
      labels:
        app-name: tending-db
    spec:
      containers:
        - name: tending-db-ctr
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_User
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_Password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tending-secrets
                  key: PgSql_Database
          livenessProbe:
            exec:
              command: [pg_isready, -U, tending_user, -d, tending_db]
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: tending-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: tending-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
