apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  labels:
    hon-khana-service: members
  name: members
spec:
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 40
      - pause: {duration: 30s}
      - setWeight: 60
      - pause: {duration: 30s}
      - setWeight: 80
      - pause: {duration: 30s}
      - setWeight: 100
  replicas: 3
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      hon-khana-service: members
  template:
    metadata:
      labels:
        hon-khana-service: members
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - args:
            - sh
            - -c
            - npx prisma generate && npx prisma migrate deploy && npm start
          envFrom:
            - secretRef:
                name: members-secrets 
          image: members
          name: members-ctr
          ports:
            - containerPort: 4003
              protocol: TCP
          resources: {}
          readinessProbe:
            tcpSocket:
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
status: {}
