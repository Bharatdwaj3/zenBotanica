apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: hon-khana
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 300M;
        root /usr/share/nginx/html;
        index index.html;
        location /api/v1/book {
            proxy_pass http://catalog.hon-khana.svc.cluster.local:4001;
        }
        location /api/v1/storage {
            proxy_pass http://catalog.hon-khana.svc.cluster.local:4001;
        }
        location /api/v1/fine {
            proxy_pass http://circulation.hon-khana.svc.cluster.local:4002;
        }

        location /api/v1/loan {
            proxy_pass http://circulation.hon-khana.svc.cluster.local:4002;
        }
        location /api/v1/auth {
            proxy_pass http://members.hon-khana.svc.cluster.local:4003;
        }
        location /api/v1/faculty {
            proxy_pass http://members.hon-khana.svc.cluster.local:4003;
        }
        location /firebase-storage/ {
            proxy_hide_header Content-Disposition;
            add_header Content-Disposition "inline";
            proxy_pass http://firebase:9199/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/v1/student {
            proxy_pass http://members.hon-khana.svc.cluster.local:4003;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
