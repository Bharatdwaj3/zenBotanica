apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: bonsai
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 300M;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
