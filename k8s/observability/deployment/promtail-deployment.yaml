apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
    kompose.version: 1.31.2 (a92241f79)
  creationTimestamp: null
  labels:
    io.kompose.service: promtail
  name: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: promtail
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
        kompose.version: 1.31.2 (a92241f79)
      creationTimestamp: null
      labels:
        io.kompose.network/bonsai-web-application-default: "true"
        io.kompose.service: promtail
    spec:
      containers:
        - args:
            - -config.file=/etc/promtail/config.yml
            - -config.expand-env=true
          image: grafana/promtail:latest
          name: bonsai-promtail
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: loki-push-creds
          ports:
            - containerPort: 8180
              hostPort: 7081
              protocol: TCP
          resources: {}
          volumeMounts:
            - mountPath: /etc/promtail/config.yml
              name: promtail-claim0
              subPath: promtail-config.yml
            - mountPath: /var/log/pods
              name: promtail-varlogpods
              readOnly: true
      serviceAccountName: promtail
      restartPolicy: Always
      volumes:
        - name: promtail-claim0
          configMap:
            name: promtail-config
        - name: promtail-varlogpods
          hostPath:
            path: /var/log/pods
status: {}
