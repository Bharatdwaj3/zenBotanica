apiVersion: v1
kind: Service
metadata:
  name: {{ include "bonsai-services.fullname" . }}-frontend
  labels:
    bonsai-service: frontend
  {{- include "bonsai-services.labels" . | nindent 4 }}
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml --out k8s/services/
    kompose.version: 1.31.2 (a92241f79)
spec:
  type: {{ .Values.frontend.type }}
  selector:
    bonsai-service: frontend
    {{- include "bonsai-services.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.frontend.ports | toYaml | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "bonsai-services.fullname" . }}-frontend
  labels:
    bonsai-service: frontend
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 120
  replicas: 3
  selector:
    matchLabels:
      bonsai-service: frontend
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 30s
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  template:
    metadata:
      labels:
        bonsai-service: frontend
    spec:
      containers:
      - image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        name: frontend-ctr
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources: {{- toYaml .Values.frontend.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-config
      imagePullSecrets:
      - name: ghcr-secret
      volumes:
      - configMap:
          name: frontend-nginx-config
        name: nginx-config
