apiVersion: v1
kind: Service
metadata:
  name: {{ include "bonsai-services.fullname" . }}-marketplace-db-headless
  labels:
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  type: {{ .Values.marketplaceDbHeadless.type }}
  selector:
    app-name: marketplace-db
    {{- include "bonsai-services.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.marketplaceDbHeadless.ports | toYaml | nindent 2 }}
