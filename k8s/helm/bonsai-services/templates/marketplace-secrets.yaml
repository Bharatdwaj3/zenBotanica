  labels:
  {{- include "bonsai-services.labels" . | nindent 4 }}
spec:
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_PASSWORD: 
    DATABASE_URL: 
    FRONTEND_ORIGIN: 
    GARDENERS_SERVICE_URL: 
    INTERNAL_SERVICE_SECRET: 
    JWT_ACC_EXPIRES_IN: 
    JWT_ACC_SECRECT: 
    JWT_REF_EXPIRES_IN: 
    JWT_REF_SECRECT: 
    PORT: 
    PgSql_Database: 
    PgSql_Password: 
    PgSql_User: 
  template:
    metadata:
      creationTimestamp: null
      name: marketplace-secrets
      namespace: bonsai
