apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bonsai-observability.fullname" . }}-cadvisor
  labels:
    io.kompose.service: cadvisor
  {{- include "bonsai-observability.labels" . | nindent 4 }}
  annotations:
    kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
    kompose.version: 1.31.2 (a92241f79)
spec:
  replicas: {{ .Values.cadvisor.replicas }}
  strategy:
    type: {{ .Values.cadvisor.strategy.type | quote }}
  selector:
    matchLabels:
      io.kompose.service: cadvisor
    {{- include "bonsai-observability.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        io.kompose.network/bonsai-web-application-default: "true"
        io.kompose.service: cadvisor
      {{- include "bonsai-observability.selectorLabels" . | nindent 8 }}
      annotations:
        kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
        kompose.version: 1.31.2 (a92241f79)
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.cadvisor.bonsaiCadvisor.image.repository }}:{{ .Values.cadvisor.bonsaiCadvisor.image.tag
          | default .Chart.AppVersion }}
        name: bonsai-cadvisor
        ports:
        - containerPort: 8080
          hostPort: 7080
          protocol: TCP
        resources: {{- toYaml .Values.cadvisor.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /rootfs
          name: cadvisor-claim0
          readOnly: true
        - mountPath: /var/run
          name: cadvisor-claim1
          readOnly: true
        - mountPath: /sys
          name: cadvisor-claim2
          readOnly: true
        - mountPath: /var/lib/docker
          name: cadvisor-claim3
          readOnly: true
      nodeSelector: {{- toYaml .Values.cadvisor.nodeSelector | nindent 10 }}
      restartPolicy: Always
      serviceAccountName: {{ include "bonsai-observability.serviceAccountName" . }}
      tolerations: {{- toYaml .Values.cadvisor.tolerations | nindent 10 }}
      topologySpreadConstraints: {{- toYaml .Values.cadvisor.topologySpreadConstraints
        | nindent 10 }}
      volumes:
      - hostPath:
          path: /
        name: cadvisor-claim0
      - hostPath:
          path: /var/run
        name: cadvisor-claim1
      - hostPath:
          path: /sys
        name: cadvisor-claim2
      - hostPath:
          path: /var/lib/docker
        name: cadvisor-claim3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bonsai-observability.fullname" . }}-grafana
  labels:
    io.kompose.service: grafana
  {{- include "bonsai-observability.labels" . | nindent 4 }}
  annotations:
    kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
    kompose.version: 1.31.2 (a92241f79)
spec:
  replicas: {{ .Values.grafana.replicas }}
  strategy:
    type: {{ .Values.grafana.strategy.type | quote }}
  selector:
    matchLabels:
      io.kompose.service: grafana
    {{- include "bonsai-observability.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        io.kompose.network/bonsai-web-application-default: "true"
        io.kompose.service: grafana
      {{- include "bonsai-observability.selectorLabels" . | nindent 8 }}
      annotations:
        kompose.cmd: kompose convert -f observability-compose.yml -o k8s/observability/
        kompose.version: 1.31.2 (a92241f79)
    spec:
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: GF_SECURITY_ADMIN_PASSWORD
              name: {{ include "bonsai-observability.fullname" . }}-grafana-secrets
        - name: GF_USERS_ALLOW_SIGN_UP
          value: {{ quote .Values.grafana.bonsaiGrafana.env.gfUsersAllowSignUp }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        envFrom:
        - secretRef:
            name: {{ include "bonsai-observability.fullname" . }}-loki-push-creds
        - secretRef:
            name: {{ include "bonsai-observability.fullname" . }}-prometheus-web-creds
        image: {{ .Values.grafana.bonsaiGrafana.image.repository }}:{{ .Values.grafana.bonsaiGrafana.image.tag
          | default .Chart.AppVersion }}
        name: bonsai-grafana
        ports:
        - containerPort: 3000
          hostPort: 7001
          protocol: TCP
        resources: {{- toYaml .Values.grafana.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-data
        - mountPath: /etc/grafana/provisioning/datasources
          name: grafana-datasources
      nodeSelector: {{- toYaml .Values.grafana.nodeSelector | nindent 10 }}
      restartPolicy: Always
      serviceAccountName: {{ include "bonsai-observability.serviceAccountName" . }}
      tolerations: {{- toYaml .Values.grafana.tolerations | nindent 10 }}
      topologySpreadConstraints: {{- toYaml .Values.grafana.topologySpreadConstraints |
        nindent 10 }}
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: {{ include "bonsai-observability.fullname" . }}-grafana-data
      - configMap:
          name: {{ include "bonsai-observability.fullname" . }}-grafana-datasources-6mhkg57dtk
        name: grafana-datasources
---
apiVersion: apps/v1
