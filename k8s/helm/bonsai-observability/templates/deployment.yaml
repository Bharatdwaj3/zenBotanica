          name: loki-htpasswd
          readOnly: true
          subPath: loki-htpasswd
      - args: {{- toYaml .Values.loki.bonsaiLoki.args | nindent 10 }}
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.loki.bonsaiLoki.image.repository }}:{{ .Values.loki.bonsaiLoki.image.tag
          | default .Chart.AppVersion }}
        name: bonsai-loki
        ports:
        - containerPort: 3101
          protocol: TCP
        resources: {{- toYaml .Values.loki.bonsaiLoki.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.loki.bonsaiLoki.containerSecurityContext |
          nindent 10 }}
        volumeMounts:
        - mountPath: /etc/loki/local-config.yml
          name: loki-config
          readOnly: true
          subPath: loki-config.yml
      nodeSelector: {{- toYaml .Values.loki.nodeSelector | nindent 10 }}
      restartPolicy: Always
      serviceAccountName: {{ include "bonsai-observability.serviceAccountName" . }}
      tolerations: {{- toYaml .Values.loki.tolerations | nindent 10 }}
      topologySpreadConstraints: {{- toYaml .Values.loki.topologySpreadConstraints | nindent
        8 }}
      volumes:
      - configMap:
          items:
          - key: loki-config.yml
            path: loki-config.yml
          - key: loki-nginx.conf
            path: loki-nginx.conf
          name: {{ include "bonsai-observability.fullname" . }}-loki-config-k29mk7hb64
        name: loki-config
      - name: loki-htpasswd
        secret:
          items:
          - key: loki-htpasswd
            path: loki-htpasswd
          secretName: {{ include "bonsai-observability.fullname" . }}-loki-htpasswd
