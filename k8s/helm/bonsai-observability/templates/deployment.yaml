        name: prometheus-claim0
      - name: prometheus-web-config
        secret:
          items:
          - key: web.yml
            path: web.yml
          secretName: {{ include "bonsai-observability.fullname" . }}-prometheus-web-config
      - name: prometheus-web-creds
        secret:
          items:
          - key: PROM_PASSWORD
