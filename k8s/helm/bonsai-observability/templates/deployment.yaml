        - containerPort: 3100
          hostPort: 7010
          protocol: TCP
        resources: {{- toYaml .Values.loki.lokiNginx.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: loki-config
