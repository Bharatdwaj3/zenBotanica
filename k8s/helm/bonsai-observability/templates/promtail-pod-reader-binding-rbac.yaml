apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bonsai-observability.fullname" . }}-promtail-pod-reader-binding
  labels:
  {{- include "bonsai-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "bonsai-observability.fullname" . }}-promtail-pod-reader'
subjects:
- kind: ServiceAccount
  name: '{{ include "bonsai-observability.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
