apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bonsai-observability.fullname" . }}-prometheus-data
  labels:
  {{- include "bonsai-observability.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.prometheusData.storageRequest | quote }}
