apiVersion: v1
kind: Service
metadata:
  name: visitor-services-db
  labels:
    app-name: visitor-services-db
  {{- include "bonsai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.db.type }}
  selector:
    app-name: visitor-services-db
    {{- include "bonsai.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.db.ports | toYaml | nindent 2 }}
