apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jam-bonsai-frontend-ingress
  namespace: jam-bonsai
  annotations:
    cert-manager.io/cluster-issuer: duckdns-letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - rudrashayan.duckdns.org
    secretName: jam-bonsai-tls-secret
  rules:
  - host: rudrashayan.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5114
