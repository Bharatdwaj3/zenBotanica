apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/jam-bonsai/workloads/
    kompose.version: 1.31.2 (a92241f79)
  creationTimestamp: null
  labels:
    io.kompose.service: visitor-db
  name: visitor-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: visitor-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/jam-bonsai/workloads/
        kompose.version: 1.31.2 (a92241f79)
      creationTimestamp: null
      labels:
        io.kompose.network/bonsai-app-network: "true"
        io.kompose.service: visitor-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: visitor_db
            - name: POSTGRES_PASSWORD
              value: visitor_pass
            - name: POSTGRES_USER
              value: visitor_user
          image: postgres:15-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready -U visitor_user -d visitor_db
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: visitor-db-ctr-btny
          ports:
            - containerPort: 5432
              hostPort: 7436
              protocol: TCP
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: visitor-data
      restartPolicy: Always
      volumes:
        - name: visitor-data
          persistentVolumeClaim:
            claimName: visitor-data
status: {}
