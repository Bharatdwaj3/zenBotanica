apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/jam-bonsai/workloads/
    kompose.version: 1.31.2 (a92241f79)
  creationTimestamp: null
  labels:
    io.kompose.service: marketplace-db
  name: marketplace-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: marketplace-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/jam-bonsai/workloads/
        kompose.version: 1.31.2 (a92241f79)
      creationTimestamp: null
      labels:
        io.kompose.network/bonsai-app-network: "true"
        io.kompose.service: marketplace-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: marketplace_db
            - name: POSTGRES_PASSWORD
              value: marketplace_pass
            - name: POSTGRES_USER
              value: marketplace_user
          image: postgres:15-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready -U marketplace_user -d marketplace_db
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: marketplace-db-ctr-btny
          ports:
            - containerPort: 5432
              hostPort: 7437
              protocol: TCP
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: marketplace-data
      restartPolicy: Always
      volumes:
        - name: marketplace-data
          persistentVolumeClaim:
            claimName: marketplace-data
status: {}
