apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  releaseName: prometheus
  timeout: 10m
  chart:
    spec:
      chart: prometheus
      version: "29.37.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  upgrade:
    remediation:
      retries: 2
  values:
    alertmanager:
      enabled: false
    kube-state-metrics:
      resources:
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      persistentVolume:
        enabled: false
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 200Mi
      retention: 2d
