apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  releaseName: grafana
  timeout: 10m
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
  upgrade:
    remediation:
      retries: 2
  values:
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            isDefault: true
            url: http://prometheus-server.monitoring.svc.cluster.local
    persistence:
      enabled: false
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 100Mi
