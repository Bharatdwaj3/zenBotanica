apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jam-bonsai
resources:
  - secrets
  - databases/firebase-data-persistentvolumeclaim.yaml
  - databases/gardeners-data-persistentvolumeclaim.yaml
  - databases/gardeners-db-deployment.yaml
  - databases/gardeners-db-headless-service.yaml
  - databases/gardeners-db-service.yaml
  - databases/grove-data-persistentvolumeclaim.yaml
  - databases/grove-db-deployment.yaml
  - databases/grove-db-headless-service.yaml
  - databases/grove-db-service.yaml
  - databases/marketplace-data-persistentvolumeclaim.yaml
  - databases/marketplace-db-deployment.yaml
  - databases/marketplace-db-headless-service.yaml
  - databases/marketplace-db-service.yaml
  - databases/tending-data-persistentvolumeclaim.yaml
  - databases/tending-db-deployment.yaml
  - databases/tending-db-headless-service.yaml
  - databases/tending-db-service.yaml
  - databases/visitor-data-persistentvolumeclaim.yaml
  - databases/visitor-db-deployment.yaml
  - databases/visitor-db-service.yaml
  - databases/visitor-services-db-headless-service.yaml
  - databases/visitor-services-db-service.yaml
  - services/caddy-deployment.yaml
  - services/caddyfile.yaml
  - services/firebase-deployment.yaml
  - services/firebase-service.yaml
  - services/frontend-deployment.yaml
  - services/frontend-nginx-config.yaml
  - services/frontend-service.yaml
  - services/gardeners-service.yaml
  - services/grove-deployment.yaml
  - services/grove-service.yaml
  - services/mailhog-deployment.yaml
  - services/mailhog-service.yaml
  - services/marketplace-deployment.yaml
  - services/marketplace-service.yaml
  - services/gardeners-env-configmap.yaml
  - services/grove-env-configmap.yaml
  - services/marketplace-env-configmap.yaml
  - services/tending-env-configmap.yaml
  - services/visitor-services-env-configmap.yaml
  - services/tending-care-reminder-cronjob.yaml
  - services/tending-deployment.yaml
  - services/tending-service.yaml
  - services/visitor-services-deployment.yaml
  - services/visitor-services-service.yaml
  - services/jam-bonsai-ingress.yaml
  - services/jam-bonsai-certificate.yaml
  - gardeners-sa.yaml
  - gardeners-cloneset.yaml
  - grove-cloneset.yaml
  - marketplace-cloneset.yaml
patches:
  # 1. Force local image usage for all Deployments and CloneSets
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: CloneSet
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # 2. Strip Vault/OpenBao annotations from gardeners CloneSet for local dev
  - target:
      kind: CloneSet
      name: gardeners
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject
      - op: remove
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1role
      - op: remove
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-secrets.env
      - op: remove
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-secrets.env

  # 3. Set replicas to 2 for Deployments and CloneSets
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: CloneSet
      name: gardeners
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: grove
    newName: bonsai-grove
    newTag: latest
  - name: gardeners
    newName: bonsai-gardeners
    newTag: latest
  - name: marketplace
    newName: bonsai-marketplace
    newTag: latest
  - name: tending
    newName: bonsai-tending
    newTag: latest
  - name: visitor-services
    newName: bonsai-visitor-services
    newTag: latest
  - name: frontend
    newName: bonsai-frontend
    newTag: latest
  - name: firebase
    newName: bonsai-firebase
    newTag: latest
