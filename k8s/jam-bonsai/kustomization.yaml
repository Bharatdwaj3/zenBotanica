namespace: jam-bonsai
resources:
  - workloads
  - databases
  - secrets
  - gardeners-sa.yaml
  - gardeners-cloneset.yaml
patches:
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      metadata:
        name: gardeners
      $patch: delete
    target:
      kind: Rollout
      name: gardeners
  - target:
      kind: Rollout
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
