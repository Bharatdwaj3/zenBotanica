apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bonsai-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bharatdwaj3/zenBotanica.git
    targetRevision: HEAD
    path: k8s/bonsai
  destination:
    server: https://kubernetes.default.svc
    namespace: bonsai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
