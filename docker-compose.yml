name: hon-khana

services:
  catalog-db:
    image: postgres:15-alpine
    container_name: catalog_db_ctr
    restart: unless-stopped
    ports:
      - 7433:5432
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  circulation-db:
    image: postgres:15-alpine
    container_name: circulation_db_ctr
    restart: unless-stopped
    ports:
      - 7434:5432
    environment:
      POSTGRES_USER: circulation_user
      POSTGRES_PASSWORD: circulation_pass
      POSTGRES_DB: circulation_db
    volumes:
      - circulation_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circulation_user -d circulation_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  members-db:
    image: postgres:15-alpine
    container_name: members_db_ctr
    restart: unless-stopped
    ports:
      - 7435:5432
    environment:
      POSTGRES_USER: members_user
      POSTGRES_PASSWORD: members_pass
      POSTGRES_DB: members_db
    volumes:
      - members_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U members_user -d members_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    container_name: catalog_ctr
    restart: unless-stopped
    env_file:
      - ./catalog/.env.prod
    ports:
      - 4001:4001
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"
    depends_on:
      catalog-db:
        condition: service_healthy
      firebase:
        condition: service_healthy

  firebase:
    build:
      context: ./firebase
      dockerfile: Dockerfile
    container_name: firebase_ctr
    restart: unless-stopped
    ports:
      - 9099:9099
      - 9199:9199
      - 4000:4000
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9199 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_ctr
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - app_network

  circulation:
    build:
      context: ./circulation
      dockerfile: Dockerfile
    container_name: circulation_ctr
    restart: unless-stopped
    env_file:
      - ./circulation/.env.prod
    ports:
      - 4002:4002
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"
    depends_on:
      circulation-db:
        condition: service_healthy
      catalog:
        condition: service_started
      mailhog:
        condition: service_started

  members:
    build:
      context: ./members
      dockerfile: Dockerfile
    container_name: members_ctr
    restart: unless-stopped
    env_file:
      - ./members/.env.prod
    ports:
      - 4003:4003
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"
    depends_on:
      members-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_ctr
    restart: unless-stopped
    ports:
      - 5114:80
    networks:
      - app_network
    depends_on:
      - catalog
      - circulation
      - members

networks:
  app_network:
    driver: bridge

volumes:
  catalog_data:
  circulation_data:
  members_data: