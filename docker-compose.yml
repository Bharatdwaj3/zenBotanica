name: bonsai

services:
  grove-db:
    image: postgres:15-alpine
    container_name: grove_db_ctr-btny
    restart: unless-stopped
    ports:
      - 7433:5432
    environment:
      POSTGRES_USER: grove_user
      POSTGRES_PASSWORD: grove_pass
      POSTGRES_DB: grove_db
    volumes:
      - grove_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grove_user -d grove_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tending-db:
    image: postgres:15-alpine
    container_name: tending_db_ctr-btny
    restart: unless-stopped
    ports:
      - 7434:5432
    environment:
      POSTGRES_USER: tending_user
      POSTGRES_PASSWORD: tending_pass
      POSTGRES_DB: tending_db
    volumes:
      - tending_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tending_user -d tending_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gardeners-db:
    image: postgres:15-alpine
    container_name: gardeners_db_ctr-btny
    restart: unless-stopped
    ports:
      - 7435:5432
    environment:
      POSTGRES_USER: gardeners_user
      POSTGRES_PASSWORD: gardeners_pass
      POSTGRES_DB: gardeners_db
    volumes:
      - gardeners_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gardeners_user -d gardeners_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grove:
    build:
      context: ./grove
      dockerfile: Dockerfile
    container_name: grove_ctr-btny
    restart: unless-stopped
    env_file:
      - ./grove/.env
    ports:
      - 4001:4001
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm start"
    depends_on:
      grove-db:
        condition: service_healthy
      firebase:
        condition: service_healthy

  firebase:
    build:
      context: ./firebase
      dockerfile: Dockerfile
    container_name: firebase_ctr-btny
    restart: unless-stopped
    ports:
      - 9099:9099
      - 9199:9199
      - 4000:4000
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9199 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_ctr-btny
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - app_network

  tending:
    build:
      context: ./tending
      dockerfile: Dockerfile
    container_name: tending_ctr-btny
    restart: unless-stopped
    env_file:
      - ./tending/.env
    ports:
      - 4002:4002
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm start"
    depends_on:
      tending-db:
        condition: service_healthy
      grove:
        condition: service_started
      mailhog:
        condition: service_started

  gardeners:
    build:
      context: ./gardeners
      dockerfile: Dockerfile
    container_name: gardeners_ctr-btny
    restart: unless-stopped
    env_file:
      - ./gardeners/.env
    ports:
      - 4003:4003
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm start"
    depends_on:
      gardeners-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_ctr-btny
    restart: unless-stopped
    ports:
      - 5114:80
    networks:
      - app_network
    depends_on:
      - grove
      - tending
      - gardeners

  visitor-db:
    image: postgres:15-alpine
    container_name: visitor_db_ctr-btny
    restart: unless-stopped
    ports:
      - 7436:5432
    environment:
      POSTGRES_USER: visitor_user
      POSTGRES_PASSWORD: visitor_pass
      POSTGRES_DB: visitor_db
    volumes:
      - visitor_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitor_user -d visitor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  visitor-services:
    build:
      context: ./visitor-services
      dockerfile: Dockerfile
    container_name: visitor_services_ctr-btny
    restart: unless-stopped
    env_file:
      - ./visitor-services/.env
    ports:
      - 4004:4004
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run dev"
    depends_on:
      visitor-db:
        condition: service_healthy

  marketplace-db:
    image: postgres:15-alpine
    container_name: marketplace_db_ctr-btny
    restart: unless-stopped
    ports:
      - 7437:5432
    environment:
      POSTGRES_USER: marketplace_user
      POSTGRES_PASSWORD: marketplace_pass
      POSTGRES_DB: marketplace_db
    volumes:
      - marketplace_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_user -d marketplace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketplace:
    build:
      context: ./marketplace
      dockerfile: Dockerfile
    container_name: marketplace_ctr-btny
    restart: unless-stopped
    env_file:
      - ./marketplace/.env
    ports:
      - 4005:4005
    networks:
      - app_network
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run dev"
    depends_on:
      marketplace-db:
        condition: service_healthy

networks:
  app_network:
    driver: bridge

volumes:
  grove_data:
  tending_data:
  gardeners_data:
  visitor_data:
  marketplace_data:
