apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hon-khana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bharatdwaj3/HonKhana.git
    targetRevision: main
    path: k8s/services
  destination:
    server: https://kubernetes.default.svc
    namespace: hon-khana
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
